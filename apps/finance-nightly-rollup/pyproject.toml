[project]
name = "finance-nightly-rollup"
version = "0.1.0"
description = "Insights Hub scheduled job owned by team finance."
requires-python = ">=3.12"
dependencies = ["insights-platform"]

[tool.uv.sources]
insights-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_nightly_rollup"]
