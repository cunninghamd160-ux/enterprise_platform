[project]
name = "layering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["insights-platform>=0.3,<0.4"]

[tool.uv.sources]
insights-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layering"]
