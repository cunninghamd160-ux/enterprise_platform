[project]
name = "stale-pin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["insights-platform>=0.1,<0.2"]

[tool.uv.sources]
insights-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stale_pin"]
