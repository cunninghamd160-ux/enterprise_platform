# These hooks are a convenience for fast local feedback and can be bypassed with --no-verify.
# CI plus branch protection is the authoritative gate; nothing is enforced *only* here.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline, --exclude-files, 'package-lock\.json(\.tmpl)?$']
  - repo: local
    hooks:
      - id: insights-check
        name: insights check
        entry: uv run insights check
        language: system
        pass_filenames: false
        files: ^apps/
      # Both frontend hooks run the app's own toolchain from its frontend/ directory, so the
      # versions pinned in its package-lock.json are the ones that judge it.
      - id: frontend-eslint
        name: frontend eslint
        language: system
        files: ^apps/[^/]+/frontend/.*\.(ts|tsx)$
        exclude: package-lock\.json$
        entry: >-
          bash -c '
          status=0;
          for dir in $(printf "%s\n" "$@" | sed -E "s#^(apps/[^/]+/frontend)/.*#\1#" | sort -u); do
            if [ ! -d "$dir/node_modules" ]; then
              echo "$dir/node_modules is missing; run: npm ci --prefix $dir"; status=1; continue;
            fi;
            files=$(printf "%s\n" "$@" | grep "^$dir/" | sed "s#^$dir/##");
            (cd "$dir" && npx eslint $files) || status=1;
          done;
          exit $status' --
      - id: frontend-prettier
        name: frontend prettier
        language: system
        files: ^apps/[^/]+/frontend/.*\.(ts|tsx|css|json)$
        exclude: package-lock\.json$
        entry: >-
          bash -c '
          status=0;
          for dir in $(printf "%s\n" "$@" | sed -E "s#^(apps/[^/]+/frontend)/.*#\1#" | sort -u); do
            if [ ! -d "$dir/node_modules" ]; then
              echo "$dir/node_modules is missing; run: npm ci --prefix $dir"; status=1; continue;
            fi;
            files=$(printf "%s\n" "$@" | grep "^$dir/" | sed "s#^$dir/##");
            (cd "$dir" && npx prettier --check $files) || status=1;
          done;
          exit $status' --
