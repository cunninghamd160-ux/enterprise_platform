# Local deployment story. Values below are the fixtures the SDK ships with; nothing here is real.
# The observability stack (OTel collector, Grafana, Tempo, Loki) is a deliberate omission — see
# NEXT.md. The seam is already OTLP: point OTEL_EXPORTER_OTLP_ENDPOINT at a collector and no app or
# SDK code changes.

x-insights-env: &insights-env
  INSIGHTS_CONN_WAREHOUSE_URL: sqlite+aiosqlite:////data/warehouse.db
  INSIGHTS_CONN_HR_API_URL: http://hr-api.fixture
  INSIGHTS_CONN_HR_API_TOKEN: fixture-token
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  people-analytics-comp:
    build:
      context: .
      dockerfile: apps/people-analytics-comp/Dockerfile
    ports:
      - "8000:8000"
    environment: *insights-env
    volumes:
      - warehouse:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Run once: docker compose run --rm finance-nightly-rollup
  finance-nightly-rollup:
    build:
      context: .
      dockerfile: apps/finance-nightly-rollup/Dockerfile
    profiles: ["jobs"]
    environment: *insights-env
    volumes:
      - warehouse:/data

  # Real Postgres for the warehouse and the owned databases; start it with
  # --profile postgres and point the apps at it with -f compose/postgres.yml.
  # warehouse.sql is mounted, not copied, so the SQLite and Postgres fixtures share one source.
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights  # pragma: allowlist secret
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./sdk/src/insights_platform/data/_fixtures/warehouse.sql:/docker-entrypoint-initdb.d/10-warehouse.sql:ro
      - ./compose/postgres/20-owned-databases.sh:/docker-entrypoint-initdb.d/20-owned-databases.sh:ro
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared cache, opt-in: docker compose --profile cache up -d redis. Apps cache in process
  # unless INSIGHTS_CACHE_URL is set; point one here with INSIGHTS_CACHE_URL: redis://redis:6379/0
  # in its environment. Keys are namespaced <app>:<key> (ADR-0004).
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  warehouse: {}
  postgres: {}
